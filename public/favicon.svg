<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Dial Base -->
  <circle cx="32" cy="32" r="22" stroke="#1e293b" stroke-width="3" fill="#090d16" fill-opacity="0.7"/>

  <!-- High-contrast Mutual Overlap Window Arc (10:45 to 1:00 active zone) -->
  <path d="M 32 10 A 22 22 0 0 1 54 32" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#favGlow)"/>

  <!-- Subtle Dashed Inner Arc -->
  <circle cx="32" cy="32" r="15" stroke="#334155" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>

  <!-- Clock Hands -->
  <!-- Hour hand -->
  <line x1="32" y1="32" x2="19" y2="23" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand entering the green mutual slot -->
  <line x1="32" y1="32" x2="45" y2="18" stroke="#34d399" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="32" cy="32" r="4" fill="#10b981"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>

  <!-- Synchrony Beacon / Active Match Dot -->
  <circle cx="49" cy="15" r="2.5" fill="#34d399"/>
</svg>
